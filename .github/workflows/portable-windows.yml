name: Windows portable release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-portable-release
  cancel-in-progress: false

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build portable executable
        run: npm run dist:portable
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Test the actual portable executable
        run: node scripts/smoke-portable.cjs
      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portable-test-diagnostics
          path: dist/smoke-test/
          if-no-files-found: ignore
      - name: Publish release after tests pass
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $exe = Get-Item "dist/Raycasting-Game-$version-Windows-x64-Portable.exe"
          gh release create "v$version" $exe.FullName --target $env:GITHUB_SHA --title "Raycasting-Game v$version — Windows portable" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
